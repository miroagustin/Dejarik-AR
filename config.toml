# Valores que se ajustan en la casa del anfitrión, sin tocar código.

[camera]
index = 0
width = 1280
height = 720
fourcc = "MJPG"
# Estos dependen del driver de cada webcam: probarlos el día 1 con
# tools/calibrate.py y descomentarlos. Si una clave no está, no se toca.
# autofocus = 0
# focus = 0
# auto_exposure = 0.25   # en DSHOW, 0.25 = manual y 0.75 = automática
# exposure = -6
# auto_wb = 0
# wb = 4500

[pose]
max_reproj_px = 3.0
min_markers = 2
hold_ms = 500
lock_stable_s = 2.0
lock_max_dt_mm = 2.0
lock_max_drot_deg = 0.5

# One-Euro: valores iniciales, se ajustan mirando el temblor con la tecla D.
[filter.t]
min_cutoff = 1.0
beta = 0.5
d_cutoff = 1.0

[filter.r]
min_cutoff = 1.0
beta = 0.05
d_cutoff = 1.0

[hands]
gesture = "dwell"        # "dwell": apoyar el índice y sostener · "touch": juntar índice y medio
on = 0.35                # se calibra en E1 con la línea de debug
off = 0.45
extended_on = 0.85       # medio estirado: |w12-w0| / |w8-w0| (largo del medio / largo del índice)
extended_off = 0.75
hold_ms = 1500           # tiempo que hay que sostener para confirmar
cancel_radius_mm = 20
cell_frames = 3
box_margin = 0.15
input_width = 320        # ancho de la imagen que ve MediaPipe: más chico = más rápido
max_fps = 20             # tope del hilo de la mano (con varias manos en cuadro MediaPipe es caro)

[net]
port = 8000
jpeg_quality = 80
remote_width = 854
remote_quality = 60
remote_max_fps = 15
cloudflared_path = "tools/bin/cloudflared.exe"

[ai]
think_min_s = 0.4
think_max_s = 0.9
tap_gap_s = 0.6

[game]
seed = 1
cpu_human_side = 1       # modo cpu: 0 = el anfitrión juega los azules, 1 = los rojos (la PC abre con los azules)

[anim]
anim_timeout_s = 5

[browser]
# Chrome o Edge (los dos son Chromium y aceptan los mismos flags). Ajustar a la PC del anfitrión.
# chrome_path = "C:/Program Files/Google/Chrome/Application/chrome.exe"
chrome_path = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
